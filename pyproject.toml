[project]
name = "cot-monitorability"
version = "0.1.0"
description = "Versioned Inspect tasks for chain-of-thought monitorability"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
authors = [{ name = "Xing Wang" }]
dependencies = [
    "inspect-ai>=0.3.287",
    "numpy>=1.26",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "nltk==3.9.1",
    "sympy>=1.13",
    "pylatexenc>=2.10",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "filelock>=3.15",
    "platformdirs>=4.0",
    "openai>=3.24.0",
]

[project.urls]
Repository = "https://github.com/XWang20/cot-monitorability"

[project.entry-points.inspect_ai]
cot_monitorability = "cot_monitorability._registry"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cot_monitorability"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "Makefile", "CONTRIBUTING.md", "pyproject.toml", "uv.lock", "README.md", "NOTICE", "LICENSE", "licenses"]

[dependency-groups]
dev = ["ruff>=0.13", "mypy>=1.13", "build", "inspect-evals-lint", "pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["dataset_download: tests requiring the pinned upstream data cache"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["src/cot_monitorability/reference"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["cot_monitorability"]
known-third-party = ["inspect_ai"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"

[tool.inspect-evals-lint]
preset = "multi-eval"
source-root = "src/cot_monitorability"
import-prefix = "cot_monitorability"
registry = "module"
registry-module = "src/cot_monitorability/_registry.py"
tests-layout = "flat"
ignore-dirs = ["reference"]
