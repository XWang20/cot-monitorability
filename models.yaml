# CoT Monitorability 评测平台模型与 API 配置文件
# 开发默认使用 DMXAPI (https://www.dmxapi.cn)，正式测评可切换至平台统一代理 (http://127.0.0.1:8000)

providers:
  dmxapi:
    name: "DMXAPI (开发/测试)"
    base_url: "https://www.dmxapi.cn/v1"
    anthropic_base_url: "https://www.dmxapi.cn"
    api_key_env: "DMXAPI_KEY"
    default_concurrency: 10
    timeout: 180
    max_retries: 3
  proxy:
    name: "平台统一代理 (LiteLLM Proxy :8000)"
    base_url: "http://127.0.0.1:8000/v1"
    anthropic_base_url: "http://127.0.0.1:8000"
    api_key_env: "PROXY_API_KEY"
    default_concurrency: 10
    timeout: 300
    max_retries: 3

autorater:
  default_model: "deepseek-v4.1-flash-1017"
  pro_model: "deepseek-v4.1-flash-1017"
  fast_model: "deepseek-v4.1-flash-1017"
  judge_model: "deepseek-v4.1-flash-1017"
  max_concurrency: 15

models:
