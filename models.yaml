    name: "DeepSeek V4.1 Flash (1017)"
    company: "DeepSeek"
    dmx_model: "deepseek-v4.1-flash-1017"
    proxy_model: "deepseek-v4.1-flash-1017"
    api_type: "openai_chat"
    raw_cot: true
    extra_body:
